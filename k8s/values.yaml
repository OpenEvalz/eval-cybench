# Kubernetes sandbox profile — cybench
version: 1
eval: cybench
readiness: excluded-at-launch
runtimeClass: gvisor

# ── EXCLUDED AT LAUNCH — this is a policy decision, not a missing profile ─────
# This eval is dual-use. Running offensive-cyber or dangerous-capability work
# against frontier models is gated behind provider structured-access programmes
# (OpenAI Trusted Access for Cyber, Anthropic's Cyber Verification Program), and
# OpenEvalz cannot vet an anonymous public user.
#
# The operational risk is not hypothetical. In July 2026 an eval agent escaped its
# sandbox by way of a PUBLIC benchmark harness, compromised a third-party sandbox
# and breached a further service over several days. OpenEvalz would be that public
# harness. Until there is a vetted-access tier with identity checks, this stays off.
exclusion:
  reason: dual-use
  gated_by: provider structured-access programmes
  revisit_when: "a vetted-access tier exists with real identity verification"
  publication: "traces from this eval must NOT be published even if it is later enabled"

# Left deliberately unpopulated. Do not fill this in to 'complete' the file — a
# working profile here is an invitation to enable the eval without the access
# controls above.
services: {}

egress:
  default: deny
  allow: []
  enforce_sni: true
  tcp_only: true

# WARNING: never set allowDomains to ["*"]. The upstream chart's
# `{{- if has "*" .Values.allowDomains }}` branch drops toPorts entirely — no SNI,
# no Host regex, all ports — and degenerates DNS to matchPattern "*".

security:
  automountServiceAccountToken: false
  serviceAccountCreate: false
  seccompProfile: RuntimeDefault
